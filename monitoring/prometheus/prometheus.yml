# Prometheus for the Smart Building stack. Targets use the Docker Compose service names; the Raspberry Pi's
# native edge brain is a separate job (set its address in the file_sd target file, see docs/MONITORING.md).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: smart-building

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: edge-brain
    metrics_path: /metrics
    static_configs:
      - targets: ["edge-brain:8001"]
        labels: {deployment: container}

  - job_name: edge-brain-pi            # the real edge on the Raspberry Pi (native systemd service)
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/edge-pi.yml"]
        refresh_interval: 1m

  - job_name: ml-api
    static_configs:
      - targets: ["ml-api:8080"]

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8090"]

  - job_name: mlflow                   # mlflow server --expose-prometheus (request counts and latency)
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["mlflow:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
