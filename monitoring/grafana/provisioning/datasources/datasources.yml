apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData: {timeInterval: 15s}
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData: {implementation: prometheus}
  - name: Telemetry DB
    uid: telemetry-db
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    editable: false
    jsonData: {database: smartbuilding, sslmode: disable, postgresVersion: 1600}
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
