# Alert routing. The default receiver only records alerts (visible in the Alertmanager UI and API).
# To get notifications, add a webhook/Slack/email receiver here; keep its URL or password out of git
# (Alertmanager reads *_file settings, e.g. slack_api_url_file, from a mounted secret).
route:
  receiver: record-only
  group_by: [alertname, job]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: record-only
      repeat_interval: 1h
receivers:
  - name: record-only
inhibit_rules:
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [severity="warning"]
    equal: [job]
