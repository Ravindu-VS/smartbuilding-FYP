[server]
hostname = "localhost"
node_ip = "127.0.0.1"

[super_admin]
username = "admin"
password = "adminpassword"
create_admin_account = true

[user_store]
type = "database_unique_id"

[database.identity_db]
type = "postgresql"
url = "jdbc:postgresql://postgres:5432/smartbuilding"
username = "admin"
password = "adminpassword"
driver = "org.postgresql.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[oauth.oidc]
id_token.issuer = "https://localhost:9443/oauth2/token"

[authentication.authenticator.basic]
name = "BasicAuthenticator"
enable = true
