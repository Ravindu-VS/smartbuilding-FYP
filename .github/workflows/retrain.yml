name: Retrain model

# Weekly and on demand: data validation -> training -> MLflow -> promotion gate. With the secret
# MLFLOW_TRACKING_URI it logs to your MLflow server (the gate then decides about production there);
# without it, it trains against a throw-away local store and keeps the model card as an artifact.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/mlops.txt
      - name: Train, evaluate, register, gate
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          python -m mlops.train > result.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("result.json"))
          p = d.get("promotion", {})
          print("### Retraining")
          print(f"- selected model: `{d['selected']}`, version {d.get('model_version')}")
          print(f"- test F1 {d['test_f1']:.4f}, accuracy {d['test_accuracy']:.4f}, data `{d['data_version']}`")
          print(f"- gate: **{p.get('decision')}** - {p.get('reason')}")
          PY
      - uses: actions/upload-artifact@v4
        with: {name: retrain-result, path: result.json}
