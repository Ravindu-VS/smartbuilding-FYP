<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Hub — 3D digital twin</title>
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js",
            "three/addons/": "./vendor/three/addons/"
        }
    }
    </script>
    <style>
        :root { color-scheme: dark; --card: rgba(9, 14, 24, 0.86); --line: rgba(148, 163, 184, 0.28); --ink: #e2e8f0; --muted: #94a3b8; --live: #22d3ee; --ai: #3987e5; --off: #d95926; }
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1018; font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
        #stage { position: absolute; inset: 0; }
        #stage canvas { display: block; outline: none; }
        #labels { position: absolute; inset: 0; pointer-events: none; }
        #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13px; background: radial-gradient(ellipse at center, #121a27 0%, #0b1018 70%); transition: opacity .6s; z-index: 5; }
        #loading.done { opacity: 0; pointer-events: none; }
        #loading .bar { width: 220px; height: 4px; border-radius: 4px; background: #1e293b; overflow: hidden; }
        #loading .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22d3ee); transition: width .2s; }
        #loading b { color: var(--ink); font-size: 15px; letter-spacing: .02em; }
        #link { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 6px 12px; border-radius: 999px; background: rgba(127, 29, 29, .9); border: 1px solid #b91c1c; color: #fee2e2; font-size: 12px; display: none; z-index: 4; }

        /* labels (CSS2D) */
        .lbl { pointer-events: auto; user-select: none; font-size: 11px; color: var(--ink); }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.35); backdrop-filter: blur(6px); min-width: 120px; cursor: pointer; transition: border-color .2s, transform .2s; }
        .card:hover { border-color: #38bdf8; transform: translateY(-1px); }
        .card.sel { border-color: #38bdf8; box-shadow: 0 0 0 1px #38bdf8, 0 6px 24px rgba(0,0,0,.4); }
        .card.live { border-color: rgba(34, 211, 238, .7); }
        .card h4 { margin: 0 0 3px; font-size: 11.5px; font-weight: 600; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .card .row { display: flex; gap: 8px; color: var(--muted); font-size: 10.5px; white-space: nowrap; align-items: center; }
        .card .row span { display: inline-flex; align-items: center; gap: 3px; }
        .card .row .on { color: #fde68a; }
        .card .row .cool { color: #7dd3fc; }
        .card .row .eco { color: #fbbf24; }
        .card .enter { margin-top: 4px; font-size: 10px; color: #7dd3fc; display: none; }
        .card.sel .enter { display: block; }
        .badge { font-size: 9px; font-weight: 700; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; background: rgba(34, 211, 238, .18); color: var(--live); border: 1px solid rgba(34, 211, 238, .5); }
        .badge.sim { background: rgba(148, 163, 184, .12); color: var(--muted); border-color: var(--line); }
        .badge.bad { background: rgba(239, 68, 68, .15); color: #fca5a5; border-color: rgba(239, 68, 68, .5); }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; display: inline-block; }
        .dot.live { background: var(--live); box-shadow: 0 0 0 0 rgba(34, 211, 238, .7); animation: pulse 1.6s infinite; }
        .dot.bad { background: #ef4444; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34, 211, 238, .7); } 70% { box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); } 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); } }
        .beacon { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px; background: var(--card); border: 1px solid rgba(34, 211, 238, .6); font-size: 11px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        .beacon.bad { border-color: rgba(239, 68, 68, .6); }
        .beacon small { font-weight: 400; color: var(--muted); }
        .floortag { font-size: 10.5px; color: #cbd5e1; padding: 2px 7px; border-radius: 6px; background: rgba(9, 14, 24, .7); border: 1px solid var(--line); white-space: nowrap; cursor: pointer; }
        .floortag:hover, .floortag.sel { border-color: #38bdf8; color: #fff; }
        .tip { pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 11px; color: var(--ink); white-space: nowrap; transform: translateY(-14px); }
        .tip small { color: var(--muted); }
        .hot { display: flex; align-items: center; gap: 6px; pointer-events: none; }
        .hot .pin { width: 9px; height: 9px; border-radius: 50%; background: #38bdf8; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 0 10px rgba(56, 189, 248, .9); flex: none; }
        .hot .pin.live { background: var(--live); }
        .hot .pin.warm { background: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, .9); }
        .hot .txt { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 7px; font-size: 10.5px; color: var(--ink); white-space: nowrap; line-height: 1.35; }
        .hot .txt small { color: var(--muted); display: block; font-size: 9.5px; }
        body.present .card { font-size: 13px; min-width: 150px; }
        body.present .card h4 { font-size: 13.5px; }
        body.present .card .row { font-size: 12px; }
        body.present .hot .txt { font-size: 12.5px; }
        body.present .beacon { font-size: 13px; }
        svg.i { width: 11px; height: 11px; flex: none; }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="labels"></div>
    <div id="loading"><b>Smart Hub digital twin</b><span id="loadmsg">Preparing the site…</span><div class="bar"><i id="loadbar"></i></div></div>
    <div id="link"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
