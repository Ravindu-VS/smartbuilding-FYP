# Cloud-side MQTT broker: the Raspberry Pi's Mosquitto bridges sb/v1/# to it (docs/DEPLOYMENT.md), ingestion reads it.
# Hardware control never depends on it: the edge keeps its own broker.
apiVersion: v1
kind: Service
metadata:
  name: mqtt
  labels: {app.kubernetes.io/name: mqtt}
spec:
  selector: {app.kubernetes.io/name: mqtt}
  ports: [{name: mqtt, port: 1883}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt
  labels: {app.kubernetes.io/name: mqtt, app.kubernetes.io/component: broker}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mqtt}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mqtt, app.kubernetes.io/component: broker}
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.20
          command: ["/bin/sh", "/mosquitto/init/start.sh"]
          envFrom: [{secretRef: {name: smartbuilding-mqtt}}]
          ports: [{name: mqtt, containerPort: 1883}]
          readinessProbe: {tcpSocket: {port: 1883}, periodSeconds: 5}
          livenessProbe: {tcpSocket: {port: 1883}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false}
          volumeMounts:
            - {name: config, mountPath: /mosquitto/config/mosquitto.conf, subPath: mosquitto.conf, readOnly: true}
            - {name: config, mountPath: /mosquitto/config/acl, subPath: acl, readOnly: true}
            - {name: config, mountPath: /mosquitto/init/start.sh, subPath: start.sh, readOnly: true}
            - {name: data, mountPath: /mosquitto/data}
      volumes:
        - name: config
          configMap: {name: mqtt-config}
        - name: data
          emptyDir: {}
