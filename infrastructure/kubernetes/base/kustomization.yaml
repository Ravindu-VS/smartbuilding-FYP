apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: smartbuilding
labels:
  - pairs: {app.kubernetes.io/part-of: smartbuilding}
    includeSelectors: false
resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - mqtt.yaml
  - mlflow.yaml
  - trainer-job.yaml
  - ml-api.yaml
  - ingestion.yaml
  - ingress.yaml
  - networkpolicy.yaml
# Secrets: generated from secrets.env (git-ignored; copy secrets.env.example) by each overlay
