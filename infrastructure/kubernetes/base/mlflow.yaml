apiVersion: v1
kind: Service
metadata:
  name: mlflow
  labels: {app.kubernetes.io/name: mlflow}
spec:
  selector: {app.kubernetes.io/name: mlflow}
  ports: [{name: http, port: 5000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  labels: {app.kubernetes.io/name: mlflow, app.kubernetes.io/component: model-registry}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: mlflow}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mlflow, app.kubernetes.io/component: model-registry}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "5000", prometheus.io/path: /metrics}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mlflow
          image: ghcr.io/ravindu-vs/smartbuilding/mlflow:latest
          env:
            - name: MLFLOW_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: smartbuilding-secrets, key: MLFLOW_DB_PASSWORD}}
            - {name: MLFLOW_BACKEND_STORE_URI, value: "postgresql://mlflow:$(MLFLOW_DB_PASSWORD)@postgres:5432/mlflow"}
            - {name: MLFLOW_ALLOWED_HOSTS, value: "mlflow,mlflow:5000,mlflow.smartbuilding.local,localhost,localhost:*,127.0.0.1:*"}
          ports: [{name: http, containerPort: 5000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 60, periodSeconds: 20}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 36}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}        # ~360 MiB measured with job execution off
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: artifacts, mountPath: /mlartifacts}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: artifacts
          persistentVolumeClaim: {claimName: mlflow-artifacts}
        - name: tmp
          emptyDir: {}
