apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartbuilding
  annotations:
    # TLS: add a tls: section with a cert-manager issuer on a real cluster (docs/SECURITY.md)
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: ml.smartbuilding.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: ml-api, port: {number: 8080}}}}
    - host: mlflow.smartbuilding.local
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: mlflow, port: {number: 5000}}}}
