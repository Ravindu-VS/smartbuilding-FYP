apiVersion: v1
kind: Service
metadata:
  name: ml-api
  labels: {app.kubernetes.io/name: ml-api}
spec:
  selector: {app.kubernetes.io/name: ml-api}
  ports: [{name: http, port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
  labels: {app.kubernetes.io/name: ml-api, app.kubernetes.io/component: model-serving}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: ml-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ml-api, app.kubernetes.io/component: model-serving}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ml-api
          image: ghcr.io/ravindu-vs/smartbuilding/ml-api:latest
          envFrom: [{configMapRef: {name: smartbuilding-config}}]
          env:
            - name: ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: smartbuilding-secrets, key: ML_ADMIN_TOKEN, optional: true}}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 5, failureThreshold: 3}
          lifecycle:
            preStop: {sleep: {seconds: 8}}      # keep serving until the ingress has dropped this pod's endpoint
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ml-api}
