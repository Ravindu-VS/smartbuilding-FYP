apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels: {app.kubernetes.io/name: ingestion}
spec:
  selector: {app.kubernetes.io/name: ingestion}
  ports: [{name: http, port: 8090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels: {app.kubernetes.io/name: ingestion, app.kubernetes.io/component: ingestion}
spec:
  replicas: 1                       # one MQTT persistent session (client id) per deployment
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ingestion}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ingestion, app.kubernetes.io/component: ingestion}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8090", prometheus.io/path: /metrics}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: ingestion
          image: ghcr.io/ravindu-vs/smartbuilding/ingestion:latest
          envFrom: [{configMapRef: {name: smartbuilding-config}}]
          env:
            - name: INGEST_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: smartbuilding-secrets, key: INGEST_DB_PASSWORD}}
            - {name: DATABASE_URL, value: "postgresql://ingest:$(INGEST_DB_PASSWORD)@postgres:5432/smartbuilding"}
            - {name: MQTT_USERNAME, value: ingest}
            - name: MQTT_PASSWORD
              valueFrom: {secretKeyRef: {name: smartbuilding-mqtt, key: MQTT_INGEST_PASSWORD}}
          ports: [{name: http, containerPort: 8090}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /metrics, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
