apiVersion: v1
kind: ConfigMap
metadata:
  name: smartbuilding-config
data:
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: room-occupancy
  MODEL_ALIAS: production
  MODEL_POLL_SECONDS: "60"
  BUILDING_TZ: Asia/Colombo
  MQTT_HOST: mqtt
  MQTT_PORT: "1883"
  INGEST_ROOMS: "*"
  ML_API_URL: http://ml-api:8080
  LOG_FORMAT: json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mqtt-config
data:
  mosquitto.conf: |
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    listener 1883
    allow_anonymous false
    password_file /mosquitto/data/passwd
    acl_file /mosquitto/config/acl
    max_queued_messages 2000
  acl: |
    # cloud broker: the edge broker bridges in as 'edge'; ingestion reads
    user edge
    topic readwrite sb/v1/#
    topic read $SYS/#
    user device
    topic write sb/v1/room/+/telemetry
    topic write sb/v1/room/+/status
    topic write sb/v1/room/+/ack
    topic read sb/v1/room/+/command
    user ingest
    topic read sb/v1/room/+/telemetry
    topic read sb/v1/room/+/status
    topic read sb/v1/room/+/ack
  start.sh: |
    #!/bin/sh
    set -eu
    PASSWD=/mosquitto/data/passwd
    : > "$PASSWD"
    for u in edge device ingest; do
      v=$(echo "$u" | tr a-z A-Z); eval "pw=\${MQTT_${v}_PASSWORD:-}"
      [ -n "$pw" ] || { echo "missing MQTT_${v}_PASSWORD" >&2; exit 1; }
      mosquitto_passwd -b "$PASSWD" "$u" "$pw"
    done
    chown mosquitto:mosquitto "$PASSWD" /mosquitto/data; chmod 0600 "$PASSWD"
    exec mosquitto -c /mosquitto/config/mosquitto.conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
data:
  01-databases.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname postgres \
         -v mlflow_pw="$MLFLOW_DB_PASSWORD" -v ingest_pw="$INGEST_DB_PASSWORD" <<'EOSQL'
    CREATE ROLE mlflow LOGIN PASSWORD :'mlflow_pw';
    CREATE DATABASE mlflow OWNER mlflow;
    CREATE ROLE ingest LOGIN PASSWORD :'ingest_pw';
    CREATE DATABASE smartbuilding OWNER ingest;
    REVOKE ALL ON DATABASE mlflow FROM PUBLIC;
    REVOKE ALL ON DATABASE smartbuilding FROM PUBLIC;
    EOSQL
