# Mosquitto for the container stack. Authentication is required; passwords come from the environment at start-up
# (infrastructure/mosquitto/start.sh) and topic rights from the ACL. TLS: see docs/SECURITY.md (listener 8883).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp_format %Y-%m-%dT%H:%M:%S
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl
max_queued_messages 2000
